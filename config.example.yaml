listen_addr: ":8080"

gitea:
  url: "https://gitea.example.com"
  token: ""
  bot_username: "giteye"

webhook:
  secret: ""

ai:
  base_url: "https://api.openai.com/v1"
  api_key: ""
  model: "gpt-4.1-mini"

mcp:
  url: ""                 # unset or empty disables MCP
  token: ""
  auth_header: "Authorization"
  allowed_tools: []        # explicit opt-in for tools not marked read-only by the MCP server

log_api_requests: false   # log AI/MCP request metadata; prompt, tool arguments, and results are omitted

notify_on_failure: true
max_concurrent_reviews: 4
max_tool_rounds: 6
review_language: "ru"
system_prompt_override: "" # replace the complete default prompt
system_prompt_addition: "" # append extra instructions to the selected prompt

limits:
  webhook_payload_bytes: 2097152
  review_context_bytes: 262144
  gitea_review_comments_bytes: 33554432
  mcp_tool_result_bytes: 65536
  mcp_tool_list_pages: 32
  mcp_discovered_tools: 256
  mcp_exposed_tools: 128
  mcp_tool_schema_bytes: 65536
  mcp_total_schema_bytes: 262144

repositories:
  example/project:
    review_language: "en"
    system_prompt_addition: "Prefer concise comments."
    notify_on_failure: false
